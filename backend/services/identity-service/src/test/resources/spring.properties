# O teto do cache de contextos do Spring de teste (padrão: 32).
#
# Cada classe de integração com configuração própria — um IdentityDeMentira, um dublê, um
# @TestPropertySource — tem um contexto só dela, e o Spring o guarda em cache até a JVM acabar,
# com as conexões abertas. Na E-9, a suíte do merchant chegou ao max_connections do PostgreSQL
# do Testcontainers por isso ("FATAL: sorry, too many clients already"). Um teto de 16
# contextos fecha o mais antigo e as conexões dele, qualquer que seja o número de classes.
# O mesmo arquivo está no merchant (ADR-080), e foi estendido à suíte na E-10 (ADR-081).
spring.test.context.cache.maxSize=16
