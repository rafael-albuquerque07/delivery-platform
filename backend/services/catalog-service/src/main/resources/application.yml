server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: catalog-service

  # spring.mongodb, e NÃO spring.data.mongodb. No Spring Boot 4 a chave antiga
  # está depreciada com nível `error` (substituta: spring.mongodb.uri) — o que
  # quer dizer que ela não é mais lida. Com ela, o serviço ignora esta URI em
  # silêncio e conecta no padrão `mongodb://localhost/test`. Descoberto na G-B1:
  # o primeiro teste que subiu contexto neste serviço gravou no Mongo do
  # compose, e não no contêiner do teste.
  mongodb:
    # O ?replicaSet=rs0 não é enfeite: sem ele o driver conecta em modo
    # avulso mesmo contra um servidor em replica set, e a falha só aparece na
    # primeira transação — ADR-008.
    #
    # ARMADILHA CONHECIDA (G-B1): rodando bootRun da máquina, este endereço
    # não funciona. O mongo-init registra o membro do replica set como
    # `mongodb:27017`, nome que só resolve dentro da rede do Docker; o driver
    # descobre esse nome e tenta falar com ele. Contêiner e Testcontainers não
    # são afetados. Está anotado no CLAUDE.md com gatilho.
    uri: ${MONGO_URI:mongodb://localhost:27017/catalog_db?replicaSet=rs0}
    representation:
      # O padrão do Boot 4 é `unspecified`, e com ele o driver se recusa a
      # gravar qualquer UUID. `standard` é o subtipo binário 4, o formato
      # interoperável — e o único que outro driver lê igual.
      uuid: standard

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    # Esta é a fábrica auto-configurada, a do OuvinteDeVinculoAlterado, que confirma
    # à mão. Não há bloco `retry` aqui, de propósito (I-B): o que existia declarava
    # `max-attempts`, que não existe no Boot 4.1.1 e nunca foi lido; e o consumo que
    # retenta tem a própria fábrica, com a ADR-026 (ConfiguracaoDoConsumoDeExpediente).
    listener:
      simple:
        acknowledge-mode: manual

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  data:
    web:
      pageable:
        # O teto não é decoração: sem ele, ?size=1000000 é uma consulta que
        # carrega o cardápio inteiro na memória do serviço — e o CLAUDE.md manda
        # paginar justamente para que isso não seja possível.
        max-page-size: 100

delivery:
  # A fixture de desenvolvimento (ADR-059): uma loja e um produto gravados pelo
  # agregado na subida. Falsa por padrão — ligada fora da máquina de quem
  # desenvolve, é dado inventado em produção. Andaime: sai com as rotas de escrita.
  semeadura:
    ligada: ${DELIVERY_SEMEADURA:false}
  # A documentação viva (Swagger UI e /v3/api-docs) sem token — ADR-050. O
  # padrão é false, e é assim que o serviço sobe em qualquer lugar que não seja
  # o seu computador: esquecer fecha.
  docs:
    abertas: ${DELIVERY_DOCS_ABERTAS:false}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:delivery-platform}
  # A porta da ADR-011, com o token de quem pediu encaminhado (ADR-045). Nada
  # aqui é credencial: endereço de serviço interno e tempo limite.
  autorizacao:
    merchant-uri: ${MERCHANT_URI:http://localhost:8082}
    # 300 ms: o número da tabela da ADR-011.
    tempo-de-conexao: 300ms
    tempo-de-leitura: 300ms
    # O cache em processo da ADR-011, invalidado pelo VinculoAlteradoV1 (ADR-048).
    cache:
      prazo-positivo: 60s
      prazo-negativo: 10s
      maximo-de-entradas: 10000
  # A exchange que o catalog escuta — os mesmos argumentos do merchant, ou o
  # serviço não sobe (ADR-048 §1).
  escuta:
    exchange: delivery.eventos
  # A reativação na abertura do expediente (catalogo.md §3, ADR-052).
  reativacao:
    # Teto de identificadores por volta da varredura. Não é paginação de
    # exposição — nada disto sai numa resposta —, é teto de memória.
    lote: 50
    # Tentativas por produto quando a gravação esbarra num conflito de versão.
    # Conflito aqui é duas pessoas no mesmo produto no mesmo segundo.
    tentativas: 3

# Mongock cumpre para o MongoDB o papel do Flyway no SQL — ADR-017.
# ATENÇÃO: este bloco é irmão de `spring`, não filho. Estava aninhado por
# engano, e com ele iam junto rabbitmq, redis e a configuração de JWT — o
# Spring ignorava os três em silêncio.
#
# E ATENÇÃO DE NOVO: este bloco sozinho não faz nada. Até a G-B1 não existia
# @EnableMongock em lugar nenhum, o jar do mongock-springboot não traz
# autoconfiguração, e nenhum changeUnit jamais rodou — com este YAML aqui,
# correto, desde o primeiro commit. Ver config/MongockConfig.
mongock:
  migration-scan-package:
    - com.deliveryplatform.catalog.infrastructure.persistence.migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  # Desligado de propósito (ADR-053): ligado, toda resposta que um
  # @RestControllerAdvice anuncia vira resposta de TODAS as operações — medido
  # na G-E, o 409 da loja sem horário apareceu no GET da listagem. Cada rota
  # declara as próprias recusas em @ApiResponses, e o ContratoDeErrosIT prova.
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.deliveryplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
