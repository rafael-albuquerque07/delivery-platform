server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: merchant-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/merchant_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # ADR-014: sete serviços relacionais no default de 10 estouram o
      # max_connections do PostgreSQL local.
      maximum-pool-size: 5
  jpa:
    hibernate:
      # Estrutura vem exclusivamente de migration.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# O que este serviço EXIGE de um token. Não há chave privada aqui: o merchant
# valida, quem emite é o identity (ADR-037). Os dois valores precisam bater com
# os do emissor -- e o decoder passa a recusar o token que não bater, em vez de
# aceitar qualquer um assinado pela chave certa.
delivery:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:delivery-platform}
  # O relay do outbox (ADR-043). Nada aqui é credencial: a do broker mora em
  # spring.rabbitmq.* e vem do ambiente.
  outbox:
    exchange: delivery.eventos
    tamanho-do-lote: 100
    intervalo-ms: 1000
    atraso-inicial-ms: 5000
    habilitado: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # O RabbitMQ NÃO está aqui de propósito: desde a C-B o outbox depende dele,
    # e um merchant sem broker deve se declarar fora de serviço em vez de
    # responder saudável enquanto acumula publicado_em is null (ADR-043 §6).
    #
    # O Redis continua desligado, e é pendência, não solução. Nada neste serviço
    # usa Redis -- a ADR-011 proíbe cache de autorização lá --, mas o starter
    # chega pelo delivery.redis-conventions e cria o indicador sozinho, com ou
    # sem spring.data.redis. Tirar o starter é emendar a ADR-021, que lista o
    # merchant como "PostgreSQL + Redis".
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.deliveryplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
