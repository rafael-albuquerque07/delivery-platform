# O teto do cache de contextos do Spring de teste (padrão: 32).
#
# Cada classe de integração que sobe o próprio IdentityDeMentira tem um contexto só dela, e o
# Spring o guarda em cache até a JVM acabar — com o pool do Hikari aberto (até 5 conexões,
# application.yml). Com 25 classes @SpringBootTest, a suíte do merchant chegou ao max_connections
# do PostgreSQL do Testcontainers: na E-9, a classe nova fez o RelayDoOutboxIT falhar ao subir,
# com "FATAL: sorry, too many clients already". Um teto de 16 contextos põe o teto em 80
# conexões, qualquer que seja o número de classes: o contexto mais antigo é fechado, e o pool
# dele com ele. ADR-080.
spring.test.context.cache.maxSize=16
