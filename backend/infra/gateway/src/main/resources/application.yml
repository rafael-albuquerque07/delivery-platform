server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity
          uri: ${SERVICE_IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/identity/**
        - id: merchant
          uri: ${SERVICE_MERCHANT_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/merchant/**
        - id: catalog
          uri: ${SERVICE_CATALOG_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/catalog/**
        - id: settlement
          uri: ${SERVICE_SETTLEMENT_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/settlement/**
        - id: order
          uri: ${SERVICE_ORDER_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/order/**
        - id: payment
          uri: ${SERVICE_PAYMENT_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/payment/**
        - id: delivery
          uri: ${SERVICE_DELIVERY_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/delivery/**
        - id: conversation
          uri: ${SERVICE_CONVERSATION_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/conversation/**
  data:
    redis:
      url: ${REDIS_URL}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI}

# CORS mora aqui, uma vez — nunca em cada serviço.
# Restringir às origens reais antes de qualquer ambiente exposto.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.deliveryplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
