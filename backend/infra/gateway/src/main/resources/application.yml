server:
  port: ${SERVER_PORT:8080}

# O prefixo abaixo é o da variante WebMVC do Spring Cloud Gateway
# (spring-cloud-starter-gateway-server-webmvc, ver build.gradle.kts). A variante
# reativa usa outro namespace para a mesma configuração, e configuração ignorada
# é silenciosa: o serviço sobe e simplesmente não roteia.
#
# Isto deixou de depender de conferência manual: RoteamentoIT sobe o gateway
# contra oito upstreams de mentira e confere as quinze rotas, uma a uma. Se o
# namespace estiver errado, nenhuma casa e a suíte inteira fica vermelha.

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          # ADR-012 — rota por RECURSO, não por serviço. O cliente não sabe
          # que existe order-service; sabe que pedido pertence a um
          # estabelecimento. Mudar o dono de um recurso é uma linha aqui,
          # não quebra de contrato público.
          #
          # A ORDEM IMPORTA: o primeiro predicado que casa vence. Rotas mais
          # específicas primeiro; nunca acrescente um `/merchants/**` genérico
          # acima destas, ou ele engole todas.
          routes:

            # ── sem escopo de estabelecimento ───────────────────────────
            - id: auth
              uri: ${SERVICE_IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**

            - id: me
              uri: ${SERVICE_IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/me/**

            # ── escopo do estabelecimento ───────────────────────────────
            # merchantId sempre na mesma posição: é dele que a invariante 9
            # extrai o identificador a confrontar com o usuário autenticado.
            - id: merchant-settings
              uri: ${SERVICE_MERCHANT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/settings/**

            - id: merchant-team
              uri: ${SERVICE_MERCHANT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/team/**

            - id: merchant-areas
              uri: ${SERVICE_MERCHANT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/areas/**

            - id: merchant-couriers
              uri: ${SERVICE_MERCHANT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/couriers/**

            - id: catalog
              uri: ${SERVICE_CATALOG_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/catalog/**

            - id: shifts
              uri: ${SERVICE_SETTLEMENT_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/shifts/**

            - id: orders
              uri: ${SERVICE_ORDER_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/orders/**

            - id: payments
              uri: ${SERVICE_PAYMENT_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/payments/**

            - id: deliveries
              uri: ${SERVICE_DELIVERY_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/merchants/{merchantId}/deliveries/**

            # ── visão do entregador ─────────────────────────────────────
            - id: courier-self
              uri: ${SERVICE_DELIVERY_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/couriers/me/**

            # ── webhooks: PÚBLICOS, sem JWT ─────────────────────────────
            # O PSP e o provedor do canal não têm token nosso. A autenticação
            # deles é assinatura no corpo, validada DENTRO do serviço.
            # Prefixo próprio e exclusivo: nenhuma outra rota mora sob
            # /webhooks/, para que a exceção de segurança seja estreita.
            - id: webhook-psp
              uri: ${SERVICE_PAYMENT_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/webhooks/psp/**

            - id: webhook-channel
              uri: ${SERVICE_CONVERSATION_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/webhooks/channel/**

  # O gateway AUTENTICA (assinatura, validade, emissor e audiência do token).
  # Quem AUTORIZA é o serviço — só ele sabe qual permissão cada endpoint exige.
  # ADR-012.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI}

# Emissor e audiência esperados. Sem estes dois, o decoder do Resource Server
# confere assinatura e tempo e mais nada — e um token de homologação, assinado
# pela chave certa, passaria em produção (ADR-044 §3). Sem valor padrão de
# propósito: o serviço recusa subir sem eles.
delivery:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

# CORS mora aqui, uma vez — nunca em cada serviço.
# Restringir às origens reais antes de qualquer ambiente exposto.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        # `gateway` exposto de propósito: é o diagnóstico de primeira pergunta
        # quando uma rota deixa de casar. Exige autenticação (ADR-044 §1) e sai
        # desta lista antes de qualquer ambiente exposto.
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.deliveryplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
