# Desenvolvimento local. Em qualquer ambiente exposto: TLS obrigatório,
# autenticação por dispositivo e ACL por tópico (§20.1 do blueprint).

listener 1883
protocol mqtt

listener 9001
protocol websockets

# allow_anonymous vale APENAS para o Compose local.
allow_anonymous true

# Produção: descomentar e provisionar
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
