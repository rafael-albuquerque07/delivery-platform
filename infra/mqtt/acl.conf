# ACL por tópico: um entregador publica somente no próprio tópico.
# O %u é substituído pelo usuário autenticado — que deve ser o courierId.
#
# Teste E2E nº 12 do blueprint: entregador não consegue publicar no tópico
# de outro entregador.

pattern write delivery/v1/couriers/%u/location
pattern write delivery/v1/couriers/%u/presence
pattern read  delivery/v1/couriers/%u/commands

# Somente o geolocation-service assina toda a árvore de telemetria.
user geolocation-service
topic read delivery/v1/couriers/+/location
topic read delivery/v1/couriers/+/presence
topic write delivery/v1/deliveries/+/tracking
