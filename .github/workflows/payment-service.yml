name: payment-service

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/services/payment-service/**'
      - 'backend/build-logic/**'
      - 'backend/gradle/libs.versions.toml'
      - 'backend/gradlew'
      - 'backend/gradle/wrapper/**'
      - 'backend/settings.gradle.kts'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/payment-service.yml'
  pull_request:
    paths:
      - 'backend/services/payment-service/**'
      - 'backend/build-logic/**'
      - 'backend/gradle/libs.versions.toml'
      - 'backend/gradlew'
      - 'backend/gradle/wrapper/**'
      - 'backend/settings.gradle.kts'
      - '.github/workflows/_service-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      module: ':services:payment-service'
