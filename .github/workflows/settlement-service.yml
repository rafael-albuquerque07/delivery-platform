name: settlement-service

on:
  push:
    paths:
      - 'backend/services/settlement-service/**'
      - 'backend/build-logic/**'
      - 'backend/gradle/libs.versions.toml'
      - '.github/workflows/settlement-service.yml'
  pull_request:
    paths:
      - 'backend/services/settlement-service/**'
      - 'backend/build-logic/**'
      - 'backend/gradle/libs.versions.toml'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      module: ':services:settlement-service'
