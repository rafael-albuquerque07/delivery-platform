name: gateway

on:
  push:
    paths:
      - 'backend/infra/gateway/**'
      - 'backend/build-logic/**'
      - 'backend/gradle/libs.versions.toml'
      - '.github/workflows/gateway.yml'
  pull_request:
    paths:
      - 'backend/infra/gateway/**'
      - 'backend/build-logic/**'
      - 'backend/gradle/libs.versions.toml'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      module: ':infra:gateway'
